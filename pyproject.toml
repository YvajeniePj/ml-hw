[project]
name = "ml-hw"
version = "0.1.0"
description = "Reproducible ML project for ML Course (HW 1-6)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "YvajeniePj", email = "zhigachev_2003@mail.ru" }
]
dependencies = [
    "joblib>=1.3.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "requests>=2.31.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pillow>=10.0.0",
    "pre-commit>=3.6.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
